[workspace]
members = ["crates/logless-core", "crates/logless-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/jamiepearcey/log-less"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
crossbeam-channel = "0.5"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
humantime-serde = "1.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
